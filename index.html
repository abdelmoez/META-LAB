<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy is delivered as a real HTTP RESPONSE HEADER by the
      server (server/security/csp.js, prompt 51) — NOT a <meta> tag. A header can
      express frame-ancestors, report-to/report-uri and per-response nonces that a
      <meta> cannot, and supports report-only ↔ enforce rollout via CSP_MODE.
      The bootstrap <script> below is authorized by its SHA-256 hash; the server-
      injected theme <script> by a per-response nonce. See docs/manager/csp-security.md.
    -->
    <title>PecanRev — Systematic Review &amp; Meta-Analysis Platform</title>
    <meta
      name="description"
      content="PecanRev is a systematic review and meta-analysis platform with screening, data extraction, risk of bias, search building, project collaboration, and a complete review workflow."
    />
    <link rel="canonical" href="https://pecanrev.com/" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      iOS ignores the manifest icons and looks for this link only. The PNG is a
      FULL-BLEED indigo square (no rounded corners of our own) because iOS masks
      it itself — transparent corners would composite to black on a home screen.
      Regenerate with: node scripts/dev/make-og-image.mjs
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Open Graph -->
    <meta property="og:title" content="PecanRev — Systematic Review &amp; Meta-Analysis Platform" />
    <meta
      property="og:description"
      content="PecanRev is a systematic review and meta-analysis platform with screening, data extraction, risk of bias, search building, project collaboration, and a complete review workflow."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PecanRev" />
    <meta property="og:url" content="https://pecanrev.com" />
    <!--
      111.md §4 — shared social image. ABSOLUTE URLs (Open Graph consumers do not
      resolve relative paths). These are the app-shell DEFAULTS; per-page values
      are set by src/frontend/website/usePageHead.js at runtime and baked into the
      prerendered HTML at build time. The 1200x630 PNG itself ships with the asset
      task; until then crawlers simply find no image (no fallback is faked).
    -->
    <meta property="og:image" content="https://pecanrev.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PecanRev — systematic review and meta-analysis platform" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PecanRev — Systematic Review &amp; Meta-Analysis Platform" />
    <meta
      name="twitter:description"
      content="PecanRev is a systematic review and meta-analysis platform with screening, data extraction, risk of bias, search building, project collaboration, and a complete review workflow."
    />
    <meta name="twitter:image" content="https://pecanrev.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      111.md §4 — font subset. Four families really are in use and none can be
      dropped: Manrope is --t-font under the Stitch theme (the default product
      UI, src/frontend/stitch/theme/stitchTokens.js STITCH_FONT), Inter is
      --t-font under the legacy day/night theme AND the fallback in every stack
      (src/frontend/theme/tokens.js FONT_STACK), and the legacy workspace shell
      + manuscript editor set 'IBM Plex Sans' / 'IBM Plex Mono' explicitly.
      What WAS trimmed is dead weights, measured against actual fontWeight /
      font-weight declarations in src/:
        IBM Plex Sans  400;500;600;700 -> 400;600;700   (no 500 callsite)
        IBM Plex Mono  400;500;700     -> 400;600;700   (no 500 callsite; 600
                                                         IS used and was being
                                                         synthesised before)
      Inter and Manrope keep 400-800: 500/600/700/800 all have callsites and
      these two are the primary faces, so this stays deliberately conservative.
      Keep this a plain blocking <link>: a JS font-swap would need a new inline
      script, and every inline script in this file is pinned by a CSP SHA-256
      hash in server/security/csp.js. Any change here must also update the
      allow-list pinned in tests/unit/seo/assets.test.js.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Theme bootstrap — set data-theme before first paint to avoid a flash.
      // Priority: explicit per-user choice (localStorage) > the site default the
      // Node server injects (window.__METALAB_DEFAULT_THEME__) > day.
      try {
        var t = localStorage.getItem('metalab_theme');
        if (t !== 'night' && t !== 'day') {
          var sd = window.__METALAB_DEFAULT_THEME__;
          t = (sd === 'night' || sd === 'day') ? sd : 'day';
        }
        document.documentElement.dataset.theme = t === 'night' ? 'night' : 'day';
      } catch (e) { document.documentElement.dataset.theme = 'day'; }
      // Brand-color bootstrap (prompt37) — apply the global accent palette as
      // inline custom properties BEFORE first paint so a custom brand never
      // flashes the default indigo, even for first-time visitors. The four tokens
      // re-skin the whole app and are theme-specific (pick the side matching the
      // data-theme set above). Priority: the server-injected CURRENT brand
      // (window.__METALAB_BRAND__ — freshest, set when the Node server serves
      // index.html) > the localStorage cache (returning visitors) > none.
      try {
        var bRaw = localStorage.getItem('metalab_brand');
        var b = window.__METALAB_BRAND__ || (bRaw ? JSON.parse(bRaw) : null);
        var side = b && b.palette && b.palette[document.documentElement.dataset.theme];
        if (side) {
          var map = { acc: '--t-acc', acc2: '--t-acc2', accText: '--t-acc-text', accBg: '--t-acc-bg' };
          var HEX = /^#[0-9a-fA-F]{6}$/;
          for (var k in map) if (HEX.test(side[k] || '')) document.documentElement.style.setProperty(map[k], side[k]);
        }
      } catch (e) { /* no brand info → stylesheet default indigo */ }
      // Design-mode bootstrap (65.md) — set data-ui-design before first paint so
      // the correct UI paints on the very first frame (no flash). Priority:
      // ?ui= override > localStorage saved mode > cached designSettings.defaultMode
      // > stitch (the product UI). This only sets an attribute — the
      // DesignModeProvider re-resolves authoritatively after auth (non-admins
      // always get the Ops-governed default unless legacy fallback is enabled),
      // so pre-paint can safely trust the cache.
      try {
        var uiVALID = { legacy: 1, stitch: 1 };
        var uiMode = null;
        try {
          var uiQ = new URLSearchParams(window.location.search).get('ui');
          if (uiQ && uiVALID[uiQ.toLowerCase()]) uiMode = uiQ.toLowerCase();
        } catch (e2) {}
        if (!uiMode) {
          var uiSaved = localStorage.getItem('metalab_ui_design');
          if (uiSaved && uiVALID[uiSaved]) uiMode = uiSaved;
        }
        if (!uiMode) {
          try {
            var uiDS = JSON.parse(localStorage.getItem('metalab_design_settings') || 'null');
            if (uiDS && uiVALID[uiDS.defaultMode]) uiMode = uiDS.defaultMode;
          } catch (e3) {}
        }
        document.documentElement.dataset.uiDesign = uiMode || 'stitch';
      } catch (e) { document.documentElement.dataset.uiDesign = 'stitch'; }
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body { background: #f6f7f9; color: #1f2937; font-family: 'Inter', 'IBM Plex Sans', system-ui, sans-serif; }
      html[data-theme="night"] body { background: #0b1120; color: #f1f5f9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
